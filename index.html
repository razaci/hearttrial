nd": "story"}, {"id": 13, "c": 1, "title": "The stranger’s promise", "scene": "One widow can leave. Instead, she stays.", "question": "Who says, “thy people shall be my people, and thy God my God”?", "options": ["Ruth", "Orpah", "Tamar", "Leah"], "answer": 0, "ref": "Ruth 1:16", "verse": "thy people shall be my people, and thy God my God", "reflection": "Ruth’s loyalty is expressed through a decision to accompany Naomi.", "kind": "story"}, {"id": 14, "c": 1, "title": "A voice without spectacle", "scene": "Wind, earthquake, and fire pass.", "question": "What follows the fire in Elijah’s encounter?", "options": ["A still small voice", "A second earthquake", "A trumpet army", "A flood"], "answer": 0, "ref": "1 Kings 19:12", "verse": "and after the fire a still small voice.", "reflection": "The narrative directs attention beyond the spectacular.", "kind": "story"}, {"id": 15, "c": 1, "title": "The emptied field", "scene": "The fig tree does not blossom. The stalls stand empty.", "question": "What does Habakkuk say he will still do?", "options": ["Rejoice in the LORD", "Buy another herd", "Trust in horses", "Hide in the palace"], "answer": 0, "ref": "Habakkuk 3:18", "verse": "Yet I will rejoice in the LORD, I will joy in the God of my salvation.", "reflection": "The declaration follows a description of profound material loss.", "kind": "story"}, {"id": 16, "c": 1, "title": "The shut door", "scene": "Danger lies beyond the queen’s door.", "question": "Who says, “if I perish, I perish”?", "options": ["Esther", "Vashti", "Jezebel", "Michal"], "answer": 0, "ref": "Esther 4:16", "verse": "and if I perish, I perish.", "reflection": "Esther acts while acknowledging the risk.", "kind": "story"}, {"id": 17, "c": 1, "title": "The stubborn night", "scene": "A struggle lasts until daybreak.", "question": "Who says he will not let go without a blessing?", "options": ["Jacob", "Esau", "Isaac", "Laban"], "answer": 0, "ref": "Genesis 32:26", "verse": "I will not let thee go, except thou ntains fear and tears, even after years have passed.", "kind": "story"}, {"id": 31, "c": 2, "title": "The fallen enemy", "scene": "A proverb considers an enemy’s downfall.", "question": "What does Proverbs 24:17 tell the reader not to do?", "options": ["Rejoice when an enemy falls", "Offer water", "Speak truth", "Remember the poor"], "answer": 0, "ref": "Proverbs 24:17", "verse": "Rejoice not when thine enemy falleth", "reflection": "The verse challenges the pleasure people can take in another person’s ruin.", "kind": "story"}, {"id": 32, "c": 2, "title": "A dinner beneath the tree", "scene": "A man climbs to see Jesus through a crowd.", "question": "Who is told Jesus must abide at his house that day?", "options": ["Zacchaeus", "Nicodemus", "Bartimaeus", "Lazarus"], "answer": 0, "ref": "Luke 19:5", "verse": "Zacchaeus, make haste, and come down; for to day I must abide at thy house.", "reflection": "The encounter moves from watching at a distance to receiving a guest.", "kind": "story"}, {"id": 33, "c": 2, "title": "The touch no one expected", "scene": "A man with leprosy asks whether Jesus is willing.", "question": "What does Jesus do before saying, “be thou clean”?", "options": ["Touches him", "Sends him away", "Asks his age", "Calls the soldiers"], "answer": 0, "ref": "Mark 1:41", "verse": "put forth his hand, and touched him, and saith unto him, I will; be thou clean.", "reflection": "The passage explicitly describes compassion and touch.", "kind": "story"}, {"id": 34, "c": 2, "title": "Kindness at the table", "scene": "A surviving member of Saul’s household is brought to David.", "question": "Who is invited to eat continually at David’s table?", "options": ["Mephibosheth", "Abner", "Shimei", "Adonijah"], "answer": 0, "ref": "2 Samuel 9:7", "verse": "and thou shalt eat bread at my table continually.", "reflection": "David frames this kindness in relation to Jonathan, Mephibosheth’s father.", "kind": "story"}, {"id": 35, "c": 2, "title": "The prayer of the dying" function play(){if(!state.session){go('home');return}let s=state.session,q=QUESTIONS[s.ids[s.index]],r=s.answers[q.id];main.innerHTML=`<div class="roundtop"><span>${esc(s.label)} · ${s.index+1} / ${s.ids.length}</span><button id="leave">Pause</button></div><div class="bar roundbar"><span style="width:${s.index/s.ids.length*100}%"></span></div>${r?`<section class="qcard"><div class="verdict ${r.correct?'':'learn'}" role="status">${r.correct?'✓ Correct — a light awakened':'A passage discovered — keep learning'}</div><div class="kicker">${CHAPTERS[q.c].name} · ${esc(q.kind)}</div><h2>${q.title}</h2>${!r.correct?`<p class="small" style="margin-top:12px">Your answer: ${esc(q.options[r.choice])}</p>`:''}<p class="answertext">${r.correct?'Answer':'The answer'}: <strong>${esc(q.options[q.answer])}</strong></p><div class="ref">${q.ref} · KJV ${q.kind==='story'?'excerpt':'verse'}</div><blockquote class="verse">“${esc(q.verse)}”</blockquote><button class="primary wide" id="next">${s.index+1===s.ids.length?'Finish this round':'Next question →'}</button><details><summary>Pause for reflection</summary><p class="reflection">${q.reflection}</p><p class="small" style="margin-top:10px">Original reflection, not Scripture. No score or right answer.</p></details><a class="readlink" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(q.ref.replace('–','-'))}&version=KJV" target="_blank" rel="noopener">Read the full passage online ↗</a></section>`:`<section class="qcard"><div class="kicker">${CHAPTERS[q.c].name} · ${esc(q.kind)}</div><h2>${q.title}</h2><p class="scene ${q.kind==='story'?'':'puzzle'}">${esc(q.scene)}</p><p class="ask">${esc(q.question)}</p><div class="answers">${shuffle(q.id).map((i,n)=>`<button class="answer" data-answer="${i}"><span class="letter">${String.fromCharCode(65+n)}</span><span>${esc(q.options[i])}</span></button>`).join('')}</div><div class="skiprow"><span class="small">No timer. Take your time.</span><button id="skip">Skip for now</button></div></section>`}`;document.getElementById('leave').onclick=()=>go('home');if(r)document.getElementById('next').onclick=next;else{main.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));document.getElementById('skip').onclick=skip;}}
function answer(i){let s=state.session;if(!s)return;let q=QUESTIONS[s.ids[s.index]];if(s.answers[q.id])return;const r={choice:i,correct:i===q.answer};s.answers[q.id]=r;if(!state.results[q.id])state.results[q.id]=r;save();chime(r.correct);render();main.scrollTop=0}
function next(){let s=state.session;if(!s)return;if(s.index+1<s.ids.length){s.index++;save();go('play')}else{summaryData={label:s.label,total:s.ids.length,answered:Object.keys(s.answers).length,correct:Object.values(s.answers).filter(a=>a.correct).length,missed:s.ids.filter(id=>s.answers[id]&&!s.answers[id].correct),skipped:s.ids.filter(id=>!s.answers[id])};state.session=null;save();go('end')}}
function skip(){next()}
function ending(){if(!summaryData){go('home');return}let r=summaryData;main.innerHTML=`<div class="kicker">Round complete</div><h2>You kept walking.</h2><p class="small" style="margin-top:12px">${esc(r.label)} · ${r.total} questions</p><div class="statrow"><div class="stat"><strong>${r.correct}</strong><span>correct this round</span></div><div class="stat"><strong>${r.answered}</strong><span>answered this round</span></div><div class="stat"><strong>${r.skipped.length}</strong><span>left for later</span></div></div>${gardenMarkup()}<h3>What will you carry onward?</h3><p class="small" style="margin-top:7px">A personal reflection. Your choice changes the garden’s colors.</p>${moodMarkup()}<button class="primary wide" id="again">Another ${state.roundSize}-question round</button>${r.missed.length?'<button class="wide" id="review">Practice the missed questions</button>':''}${r.skipped.length?'<button class="wide" id="skipped">Return to skipped questions</button>':''}<button class="wide" id="home">Return to Play</button>`;bindMoods();document.getElementById('again').onclick=()=>startRound();document.getElementById('home').onclick=()=>go('home');if(r.missed.length)document.getElementById('review').onclick=()=>startIds(r.missed,'Practice · missed questions');if(r.skipped.length)document.getElementById('skipped').onclick=()=>startIds(r.skipped,'Questions left for later')}
function gardenMarkup(){return `<div class="gardenbox"><canvas class="garden" role="img" aria-label="Your night garden growing with discovered KJV passages"></canvas><div class="gardenlabel">${count()} / 500 passages awakened</div></div>`}
function moodMarkup(){return `<div class="moods">${['hope','peace','courage'].map(m=>`<button data-mood="${m}" aria-pressed="${state.mood===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>`}
function bindMoods(){main.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood;save();render();chime(true)})}
function gardenPage(){main.innerHTML=`<div class="kicker">The garden of remembrance</div><h2>Your light grows here.</h2><p class="small" style="margin-top:10px">Every five discoveries grow a flower. Each chapter’s 125 discoveries restore another part of the garden.</p>${gardenMarkup()}${CHAPTERS.map((c,i)=>`<div class="achievement"><span>${c.symbol} ${c.name}</span><span>${count(i)===125?'Restored ✓':count(i)+' / 125'}</span></div>`).join('')}<div class="sectionhead"><h3>Choose an atmosphere</h3></div>${moodMarkup()}<p class="small" style="margin-top:14px">Hope, peace, and courage are personal choices, without a score.</p>`;bindMoods()}
function journal(){main.innerHTML=`<div class="kicker">Keep the passages close</div><h2>Verse journal</h2><input id="search" class="search" type="search" aria-label="Search passages" placeholder="Search tears, Ruth, mercy…" value="${esc(journalQuery)}"><label class="check small"><input id="all" type="checkbox" ${journalAll?'checked':''}>Show the entire 500-question collection</label><div id="entries"></div><div id="paging"></div>`;const update=()=>{let q=journalQuery.toLowerCase();let qs=QUESTIONS.filter(x=>(journalAll||state.results[x.id])&&[x.title,x.ref,x.verse,x.question,x.options.join(' ')].join(' ').toLowerCase().includes(q));let pages=Math.max(1,Math.ceil(qs.length/20));journalPage=Math.min(journalPage,pages-1);document.getElementById('entries').innerHTML=qs.length?qs.slice(journalPage*20,journalPage*20+20).map(x=>`<article class="journalrow"><div class="kicker">${CHAPTERS[x.c].name} · ${x.kind}</div><h3>${x.title}</h3><div class="ref">${x.ref} · KJV</div><blockquote class="verse">“${esc(x.verse)}”</blockquote><button data-revisit="${x.id}">Play this question</button></article>`).join(''):'<p class="empty">No matching discoveries yet. Play a round or show the entire collection.</p>';document.getElementById('paging').innerHTML=qs.length?`<div class="paging"><button id="prev" ${journalPage===0?'disabled':''}>← Previous</button><span class="small">${journalPage+1} / ${pages} · ${qs.length} results</span><button id="more" ${journalPage+1===pages?'disabled':''}>Next →</button></div>`:'';main.querySelectorAll('[data-revisit]').forEach(b=>b.onclick=()=>startIds([+b.dataset.revisit],'Single question'));if(qs.length){document.getElementById('prev').onclick=()=>{journalPage--;update();main.scrollTop=0};document.getElementById('more').onclick=()=>{journalPage++;update();main.scrollTop=0}}};document.getElementById('search').oninput=e=>{journalQuery=e.target.value;journalPage=0;update()};document.getElementById('all').onchange=e=>{journalAll=e.target.checked;journalPage=0;update()};update()}
function options(){main.innerHTML=`<div class="kicker">Make it comfortable</div><h2>Your options</h2><label class="check"><input id="large" type="checkbox" ${state.large?'checked':''}>Larger reading text</label><div class="sectionhead"><h3>Question collection</h3></div><div class="achievement"><span>Story questions</span><strong>148</strong></div><div class="achievement"><span>Missing-word puzzles</span><strong>88</strong></div><div class="achievement"><span>Opening-phrase puzzles</span><strong>88</strong></div><div class="achievement"><span>Closing-phrase puzzles</span><strong>88</strong></div><div class="achievement"><span>Find-the-book puzzles</span><strong>88</strong></div><details><summary>How this little app works</summary><p class="reflection">All 500 questions, included verses, garden artwork, and optional sound work offline inside this HTML file. Progress stays in this browser when storage is available. The bottom bar keeps the four app pages within reach. “Read the full passage online” needs internet.</p><p class="reflection">First-answer accuracy measures text knowledge. It does not measure faith or personal worth. Replaying a question gives a new round score and preserves the original first-answer record. Skips are not marked incorrect.</p><p class="reflection">KJV excerpts and verses are labeled separately from original scene introductions and reflections. The 352 verse puzzles are built from distinct source verses; the 148 story questions are separately written. This file contains selected verses rather than the entire Bible.</p><p class="reflection">KJV text source: <a href="https://github.com/thiagobodruk/bible/blob/master/json/en_kjv.json" target="_blank" rel="noopener">Bible JSON collection ↗</a>.</p></details><details><summary>Start fresh</summary><p class="reflection">Clear your saved answers, current round, and garden progress in this browser.</p><button class="wide" id="reset">Reset progress</button><div id="confirm" hidden><p class="reflection">Clear this journey?</p><div class="segments" style="margin-top:12px"><button id="yes">Yes, clear</button><button id="no">Keep it</button></div></div></details><p class="small" style="margin-top:20px">Sound stays optional. It pauses when this page is hidden.</p>`;document.getElementById('large').onchange=e=>{state.large=e.target.checked;save();document.body.classList.toggle('large',state.large)};document.getElementById('reset').onclick=()=>document.getElementById('confirm').hidden=false;document.getElementById('no').onclick=()=>document.getElementById('confirm').hidden=true;document.getElementById('yes').onclick=()=>{state.results={};state.session=null;save();go('home')}}

const ROUTES={
 gate:{name:'The Lantern Crossing',theme:'crossing',scene:'Two paths leave a ruined garden. One follows the people who stayed to help. The other follows the people who had to leave.',guide:'I am Lumen, your fictional lantern keeper. Choose a story to walk through. The path changes the passages you meet; it does not judge your choice.',choices:[['mercy','Follow the road of mercy','Look for care in unexpected places.'],['exile','Follow the road of exile','Listen to loss, distance, and belonging.']]},

 morning:{name:'The Morning Garden',theme:'dawn',scene:'The garden opens to the sky. The journey has held both pain and hope, and neither needs to erase the other.',guide:'You have followed a path through the collection. Keep a reflection if you wish, or take another path and meet different passages.',refs:['Lamentations 3:22–23','Revelation 21:4','Psalm 30:5','Isaiah 61:3','Matthew 11:28','Revelation 22:17'],choices:[]}

try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){if(s.notes&&typeof s.notes==='object')for(const [k,n] of Object.entries(s.notes)){if((/^q\d+$/.test(k)&&QUESTIONS[+k.slice(1)]||k.startsWith('route:')&&ROUTES[k.slice(6)])&&n&&typeof n.text==='string')state.notes[k]={text:n.text.slice(0,1500),updated:Number(n.updated)||0};}if(s.journey&&ROUTES[s.journey.node]){state.journey={node:s.journey.node,visited:[...new Set((s.journey.visited||[]).filter(k=>ROUTES[k]))],completed:[...new Set((s.journey.completed||[]).filter(k=>ROUTES[k]))],used:[...new Set((s.journey.used||[]).filter(id=>Number.isInteger(id)&&QUESTIONS[id]))],choices:(s.journey.choices||[]).filter(x=>x&&ROUTES[x.from]&&ROUTES[x.to]).slice(-40)};}state.guide=s.guide!==false;if(state.session&&s.session?.routeNode&&ROUTES[s.session.routeNode])state.session.routeNode=s.session.routeNode;}}catch{}

function noteEditor(key,prompt){return `<div class="noteeditor"><label class="small" for="note">${esc(prompt)}</label><textarea id="note" rows="3" maxlength="1500" placeholder="Your own words. You can leave this blank.">${esc(state.notes[key]?.text||'')}</textarea><div class="notebar"><span id="notestatus" class="small">Private to this browser · 1500 characters</span><button id="saveNote">Save reflection</button></div></div>`}
function bindNote(key){const input=document.getElementById('note');if(!input)return;const write=()=>{const text=input.value.trim();if(text)state.notes[key]={text,updated:Date.now()};else delete state.notes[key];const persisted=save();document.getElementById('notestatus').textContent=persisted?'Saved in this browser':'Saved for this session only';};input.onchange=write;document.getElementById('saveNote').onclick=write;}
function guideMarkup(text){return `<aside class="guidecard"><span class="lantern" aria-hidden="true">✧</span><div><strong>Lumen</strong><span class="small"> · fictional companion</span><p>${esc(text)}</p></div></aside>`}
function enterRoute(to){let j=state.journey,from=j.node;if(!ROUTES[from].choices.some(c=>c[0]===to))return;j.choices.push({from,to});j.node=to;if(!j.visited.includes(to))j.visited.push(to);save();go('journey')}
function routeQuestions(node){let r=ROUTES[node],exact=(r.refs||[]).map(ref=>QUESTIONS.find(q=>q.ref===ref)).filter(Boolean);let raw=r.ids?r.ids.map(id=>QUESTIONS[id]).filter(Boolean):exact;if(!raw.length){let c=r.theme==='mercy'?2:r.theme==='dawn'?3:1;raw=QUESTIONS.filter(q=>q.c===c&&q.kind==='story')}let unused=raw.filter(q=>!state.journey.used.includes(q.id));let c=r.theme==='mercy'?2:r.theme==='dawn'?3:1;let extras=QUESTIONS.filter(q=>q.c===c&&q.kind==='story'&&!state.journey.used.includes(q.id)&&!raw.some(x=>x.id===q.id));return [...unused,...extras,...raw.filter(q=>!unused.includes(q))].slice(0,6).map(q=>q.id)}
function beginRouteRound(){let node=state.journey.node;const ids=routeQuestions(node);startIds(ids,ROUTES[node].name);state.session.routeNode=node;save()}
function journey(){let j=state.journey,r=ROUTES[j.node],complete=j.completed.includes(j.node),isGate=j.node==='gate';main.innerHTML=`<button class="back" id="routeBack">← Play</button><div class="kicker">The lantern journey · ${j.completed.length} stops discovered</div><h2>${r.name}</h2><canvas class="routeart" id="routeArt" role="img" aria-label="An illustrated ${r.theme} landscape"></canvas><p class="routescene">${r.scene}</p>${state.guide?guideMarkup(r.guide):''}${!isGate&&!complete?`<button class="primary wide" id="routeStart">${state.session?.routeNode===j.node?'Continue this stop':'Enter this story · 6 questions'}</button>`:''}${!isGate&&complete?`<div class="verdict">✓ This stop is discovered</div>${noteEditor('route:'+j.node,'Which detail will you carry from this place?')}`:''}${isGate||complete?`<div class="sectionhead"><h3>${r.choices.length?'Choose the next path':'Your route is complete'}</h3></div><div class="routechoices">${r.choices.map(([to,label,desc])=>`<button data-route="${to}"><strong>${label} →</strong><span class="small">${desc}</span></button>`).join('')}</div>${!r.choices.length?'<button class="primary wide" id="newPath">Walk another path</button>':''}`:''}<details><summary>Your footsteps</summary><div class="footsteps">${j.visited.map(k=>`<span class="${j.completed.includes(k)?'done':''}">${ROUTES[k].name}${j.completed.includes(k)?' ✓':''}</span>`).join('')}</div><p class="small">These are original fictional landscapes around actual KJV passages. Your path choices have no right or wrong answer.</p></details>`;document.getElementById('routeBack').onclick=()=>go('home');if(document.getElementById('routeStart'))document.getElementById('routeStart').onclick=()=>state.session?.routeNode===j.node?go('play'):beginRouteRound();main.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>enterRoute(b.dataset.route));if(complete)bindNote('route:'+j.node);if(document.getElementById('newPath'))document.getElementById('newPath').onclick=()=>{j.node='gate';save();go('journey')};drawRouteArt(r.theme)}
function drawRouteArt(theme){let c=document.getElementById('routeArt');if(!c)return;c.width=720;c.height=280;let x=c.getContext('2d'),gold='#e6ca8f',dawn=theme==='dawn',water=theme==='exile';let g=x.createLinearGradient(0,0,0,280);g.addColorStop(0,dawn?'#553551':'#111b36');g.addColorStop(1,dawn?'#e3a27f':'#425c6a');x.fillStyle=g;x.fillRect(0,0,720,280);x.fillStyle=gold;x.shadowColor=gold;x.shadowBlur=22;x.beginPath();x.arc(570,70,dawn?35:19,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let i=0;i<30;i++){x.fillStyle='#e6ddcf';x.fillRect((i*137)%720,(i*37)%140,1.5,1.5)}x.fillStyle='#142838';x.beginPath();x.moveTo(0,210);for(let i=0;i<=8;i++)x.lineTo(i*100,140+Math.sin(i*2)*45);x.lineTo(720,280);x.lineTo(0,280);x.fill();x.fillStyle=water?'#577e91':'#746c65';x.beginPath();x.moveTo(345,177);x.bezierCurveTo(480,215,185,239,330,280);x.lineTo(430,280);x.bezierCurveTo(260,239,525,205,360,177);x.fill();for(let i=0;i<3;i++){let px=190+i*165,py=196+i%2*20;x.fillStyle='#0b1825';x.fillRect(px-3,py,6,58);x.strokeStyle='#233d47';x.lineWidth=12;x.beginPath();x.moveTo(px,py+20);x.lineTo(px-22,py-8);x.moveTo(px,py+15);x.lineTo(px+24,py-18);x.stroke()}for(let i=0;i<5;i++){let px=280+i*34,py=205+i*12;x.fillStyle='#20303d';x.fillRect(px,py,4,24);x.fillStyle=gold;x.shadowBlur=14;x.shadowColor=gold;x.fillRect(px-3,py-8,10,13);x.shadowBlur=0}}
const baseHome=home;home=function(){baseHome();const box=document.createElement('div');box.className='journeyentry';box.innerHTML=`<button id="openJourney"><span class="lantern" aria-hidden="true">✧</span><span><strong>${state.journey.node==='gate'?'Walk the lantern journey':'Continue: '+ROUTES[state.journey.node].name}</strong><small>Branching stories · Lumen · your reflections</small></span><span aria-hidden="true">→</span></button>`;main.querySelector('.hero').after(box);document.getElementById('openJourney').onclick=()=>go('journey')};

const basePlay=play;play=function(){basePlay();if(!state.session)return;let q=QUESTIONS[state.session.ids[state.session.index]],answered=state.session.answers[q.id];const card=main.querySelector('.qcard');if(state.guide){let d=document.createElement('div');d.className='guidecontrols';d.innerHTML=`<button id="askGuide">✧ Ask Lumen</button><div id="guideReply" hidden></div>`;card.append(d);document.getElementById('askGuide').onclick=()=>{let box=document.getElementById('guideReply');box.hidden=!box.hidden;if(box.hidden)return;box.innerHTML=guideMarkup(answered?q.reflection:q.kind==='story'?'Look closely at the action named in the question. This moment is found in '+q.ref.replace(/\s\d.*$/,'')+'. Take the time you need.':'Read the surrounding words aloud if that helps. Keep the KJV phrasing in mind, rather than choosing only the most comforting option.');};}if(answered){let d=document.createElement('details');d.innerHTML=`<summary>Write your own reflection</summary>${noteEditor('q'+q.id,'What did this passage bring to mind?')}`;card.append(d);bindNote('q'+q.id);}};

function validPermutation(a){return Array.isArray(a)&&a.length===4&&new Set(a).size===4&&a.every(n=>Number.isInteger(n)&&n>=0&&n<4)}
function cleanTrials(input){let t={orderDone:[],matchDone:[],themeDone:[],active:null};if(!input||typeof input!=='object')return t;t.orderDone=Array.isArray(input.orderDone)?[...new Set(input.orderDone.filter(k=>Object.hasOwn(ORDER_TRIALS,k)))]:[];t.matchDone=Array.isArray(input.matchDone)?[...new Set(input.matchDone.filter(k=>Object.hasOwn(MATCH_TRIALS,k)))]:[];t.themeDone=Array.isArray(input.themeDone)?[...new Set(input.themeDone.filter(k=>Object.hasOwn(THEMED_TRIALS,k)))]:[];let a=input.active;if(a?.type==='order'&&Object.hasOwn(ORDER_TRIALS,a.key)&&validPermutation(a.order))t.active={type:'order',key:a.key,order:[...a.order],feedback:'',clue:!!a.clue,solved:a.order.every((v,i)=>v===i)&&!!a.solved};if(a?.type==='match'&&Object.hasOwn(MATCH_TRIALS,a.key)&&validPermutation(a.actions))t.active={type:'match',key:a.key,actions:[...a.actions],matched:Array.isArray(a.matched)?[...new Set(a.matched.filter(n=>Number.isInteger(n)&&n>=0&&n<4))]:[],selected:Number.isInteger(a.selected)&&a.selected>=0&&a.selected<4?a.selected:null,feedback:''};return t;}

function trialsHub(){let t=state.trials;main.innerHTML=`<button class="back" id="trialsBack">← Adventures</button><div class="kicker">Touch, arrange, connect</div><h2>The story trials</h2><p class="small" style="margin-top:9px">New ways to read closely. No timer and no lost lives.</p>${t.active?'<button class="primary wide" id="resumeTrial">Continue your saved trial</button>':''}<div class="segments" style="margin-top:16px">${[['order','Arrange events'],['match','Connect people'],['themes','Theme trails']].map(([k,n])=>`<button data-trialtab="${k}" class="${trialsTab===k?'active':''}">${n}</button>`).join('')}</div><div class="sectionhead"><h3>${trialsTab==='order'?'What happened first?':trialsTab==='match'?'Who did what?':'Choose a feeling to explore'}</h3><span class="small">${trialsTab==='themes'?'6 themes':'12 trials'}</span></div><div class="arclist">${Object.entries(trialsTab==='order'?ORDER_TRIALS:trialsTab==='match'?MATCH_TRIALS:THEMED_TRIALS).map(([k,v])=>`<button data-trial="${k}"><strong>${v.name}</strong><span>${trialsTab==='order'?'Arrange four events using the arrow buttons.':trialsTab==='match'?'Tap a person, then the action that belongs to them.':v.intro}</span><small>${(trialsTab==='order'?t.orderDone:trialsTab==='match'?t.matchDone:t.themeDone).includes(k)?'Discovered ✓':trialsTab==='themes'?'8 questions':'Four connections'}</small></button>`).join('')}</div><button class="wide" id="trialAwards">Your lantern milestones →</button>`;document.getElementById('trialsBack').onclick=()=>go('adventures');main.querySelectorAll('[data-trialtab]').forEach(b=>b.onclick=()=>{trialsTab=b.dataset.trialtab;render();main.scrollTop=0});main.querySelectorAll('[data-trial]').forEach(b=>b.onclick=()=>trialsTab==='themes'?startTheme(b.dataset.trial):startTrial(trialsTab,b.dataset.trial));if(t.active)document.getElementById('resumeTrial').onclick=()=>go('trial');document.getElementById('trialAwards').onclick=()=>go('milestones')}
function startTrial(type,key){let a=type==='order'?{type,key,order:shuffleArray([0,1,2,3]),feedback:'',clue:false,solved:false}:{type,key,actions:shuffleArray([0,1,2,3]),matched:[],selected:null,feedback:''};if(type==='order'&&a.order.every((v,i)=>v===i))a.order.reverse();state.trials.active=a;save();go('trial')}
function moveEvent(position,direction){let a=state.trials.active;if(a?.type!=='order'||a.solved)return;let to=position+direction;if(to<0||to>3)return;[a.order[position],a.order[to]]=[a.order[to],a.order[position]];a.feedback='';save();render()}
function checkOrder(){let a=state.trials.active;if(a?.type!=='order')return;a.solved=a.order.every((v,i)=>v===i);a.feedback=a.solved?'The events are in the story’s order.':'Some events are still out of order. Compare the changes between each moment and try again.';if(a.solved&&!state.trials.orderDone.includes(a.key))state.trials.orderDone.push(a.key);save();chime(a.solved);render()}
function selectPerson(index){let a=state.trials.active;if(a?.type!=='match'||a.matched.includes(index))return;a.selected=index;a.feedback='Now choose the action.';save();render()}
function matchAction(index){let a=state.trials.active;if(a?.type!=='match'||a.selected===null||a.matched.includes(index))return;if(index===a.selected){a.matched.push(index);a.selected=null;a.feedback='A connection discovered.';chime(true);}else a.feedback='Those belong to different scenes. Try another action or choose a different person.';if(a.matched.length===4){a.feedback='All four connections are discovered.';if(!state.trials.matchDone.includes(a.key))state.trials.matchDone.push(a.key);}save();render()}
function sourceProof(items){return `<details class="trialproof"><summary>Read the KJV evidence</summary>${items.map(e=>`<div class="ref">${e.ref} · KJV</div><blockquote class="verse">“${esc(e.text)}”</blockquote>`).join('')}</details>`}
function trialPage(){let a=state.trials.active;if(!a){go('trials');return;}let isOrder=a.type==='order',d=isOrder?ORDER_TRIALS[a.key]:MATCH_TRIALS[a.key],done=isOrder?a.solved:a.matched.length===4;main.innerHTML=`<button class="back" id="trialPause">← Trials · progress saved</button><div class="kicker">${isOrder?'Arrange the story':'Connect the people'}</div><h2>${d.name}</h2><p class="small" style="margin-top:10px">${isOrder?'Move each event up or down. Put the earliest at the top.':'Tap one person on the left, then their action on the right.'}</p>${isOrder?`<div class="timelinecards">${a.order.map((id,i)=>`<div class="timelinecard"><span class="stepnumber">${i+1}</span><div><strong>${esc(d.events[id].label)}</strong>${a.clue||done?`<span class="small">${d.events[id].ref}</span>`:''}</div>${!done?`<div class="arrows"><button data-up="${i}" aria-label="Move event ${i+1} earlier" ${i===0?'disabled':''}>↑</button><button data-down="${i}" aria-label="Move event ${i+1} later" ${i===3?'disabled':''}>↓</button></div>`:''}</div>`).join('')}</div>${!done?'<button class="primary wide" id="checkOrder">Check the order</button><button class="smallbutton" id="orderClue">Show the references as a clue</button>':''}`:`<div class="matchcolumns"><div>${d.pairs.map((e,i)=>`<button class="person ${a.selected===i?'selected':''} ${a.matched.includes(i)?'matched':''}" data-person="${i}" ${a.matched.includes(i)?'disabled':''}>${esc(e.person)}${a.matched.includes(i)?' ✓':''}</button>`).join('')}</div><div>${a.actions.map(i=>`<button class="action ${a.matched.includes(i)?'matched':''}" data-action="${i}" ${a.matched.includes(i)?'disabled':''}>${esc(d.pairs[i].action)}${a.matched.includes(i)?' ✓':''}</button>`).join('')}</div></div><p class="small">${a.matched.length} / 4 connections discovered</p>`}<p class="trialfeedback" role="status">${esc(a.feedback)}</p>${done?`<div class="verdict">✓ Trial complete · two restoration points</div>${sourceProof(isOrder?d.events:d.pairs)}<button class="primary wide" id="anotherTrial">Choose another trial</button><button class="wide" id="trialWorld">Visit your changing world</button>`:''}`;document.getElementById('trialPause').onclick=()=>go('trials');if(isOrder&&!done){main.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveEvent(+b.dataset.up,-1));main.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveEvent(+b.dataset.down,1));document.getElementById('checkOrder').onclick=checkOrder;document.getElementById('orderClue').onclick=()=>{a.clue=true;save();render()};}if(!isOrder){main.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>selectPerson(+b.dataset.person));main.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>matchAction(+b.dataset.action));}if(done){document.getElementById('anotherTrial').onclick=()=>go('trials');document.getElementById('trialWorld').onclick=()=>go('world')}}
function startTheme(key){let existing=state.session?.themeKey===key?state.session:state.pausedQuiz?.themeKey===key?state.pausedQuiz:null;if(existing){if(existing!==state.session){parkSession();state.pausedQuiz=null;state.session=existing;save()}go('play');return;}startIds(shuffleArray(THEMED_TRIALS[key].ids).slice(0,8),THEMED_TRIALS[key].name);state.session.themeKey=key;save();render()}
const themedNext=next;next=function(){let s=state.session;if(s?.themeKey&&s.index+1===s.ids.length){let missing=s.ids.filter(id=>!s.answers[id]);if(missing.length){s.ids=missing;s.index=0;save();go('play');return;}if(!state.trials.themeDone.includes(s.themeKey))state.trials.themeDone.push(s.themeKey);save();}themedNext()};
function earnedMilestones(){return [{name:'First Light',desc:'Discover 10 questions.',goal:10,value:count()},{name:'The Patient Reader',desc:'Complete one memory round.',goal:1,value:state.memoryRounds},{name:'The Story Keeper',desc:'Complete three connected story arcs.',goal:3,value:state.arcDone.length},{name:'The Thread of Time',desc:'Complete four chronology trials.',goal:4,value:state.trials.orderDone.length},{name:'The Witness',desc:'Complete four people-and-action trials.',goal:4,value:state.trials.matchDone.length},{name:'The Restored Lanterns',desc:'Restore all four world places.',goal:4,value:worldMilestones().filter(Boolean).length}]}
function milestonesPage(){main.innerHTML=`<button class="back" id="milestoneBack">← Trials</button><div class="kicker">Your in-game discoveries</div><h2>Lantern milestones</h2><p class="small" style="margin-top:10px">These recognize game progress and reading practice. They do not rate faith.</p><div class="milestonelist">${earnedMilestones().map(m=>`<article class="milestone ${m.value>=m.goal?'earned':''}"><span aria-hidden="true">${m.value>=m.goal?'✦':'◇'}</span><div><h3>${m.name}</h3><p class="small">${m.desc}</p><small>${m.value>=m.goal?'Discovered ✓':Math.min(m.value,m.goal)+' / '+m.goal}</small></div></article>`).join('')}</div>`;document.getElementById('milestoneBack').onclick=()=>go('trials')}
const trialScore=worldScore;worldScore=function(){return trialScore()+(state.trials.orderDone.length+state.trials.matchDone.length+state.trials.themeDone.length)*2};
const trialWorldPage=worldPage;worldPage=function(){trialWorldPage();let p=main.querySelector('p.small:last-child');if(p)p.textContent+=' Each newly completed trial also adds two.';};
const trialHub=adventureHub;adventureHub=function(){trialHub();let b=document.createElement('button');b.id='openTrials';b.className='wide featurebutton';b.innerHTML='<strong>Story trials →</strong><span>Arrange events · connect people · explore six themes</span>';main.querySelector('.featuregrid').after(b);b.onclick=()=>go('trials')};
const trialRender=render;render=function(){if(['trials','trial','milestones'].includes(page)){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page==='home'));document.body.classList.toggle('large',state.large);if(page==='trials')trialsHub();else if(page==='trial')trialPage();else milestonesPage();}else trialRender()};
const trialBackupNormalize=normalizeBackup;normalizeBackup=function(payload){let clean=trialBackupNormalize(payload);clean.trials=cleanTrials(payload.data.trials);return clean};

const KEEPER_REGIONS=[
 {name:'The Unlit Garden',color:'#244a40',sky:'#121c2d',story:'A gardener waits beside a broken crossing. Four quiet stories can rekindle this place.',people:['The gardener','A grieving traveler','The child at the well','The keeper of the gate']},
 {name:'The Waiting Desert',color:'#675340',sky:'#211d30',story:'Beyond the dunes, travelers have kept a lamp burning through a long night.',people:['The water carrier','The patient watchman','The weary messenger','A traveler far from home']},
 {name:'The Mercy Courtyard',color:'#42405d',sky:'#181c31',story:'The courtyard has fallen silent. Listen to its visitors and open a road through it.',people:['The returning friend','The prison visitor','The shelter keeper','The mender of garments']},
 {name:'The Shore of Morning',color:'#35546b',sky:'#19283c',story:'The last lantern stands above the sea. Gather the scattered stories and bring the morning home.',people:['The fisher at dawn','The woman by the shore','The table keeper','The morning watchman']}
];
const KEEPER_POINTS=[{x:1,y:4,key:'camp',kind:'camp',label:'Camp'},{x:3,y:1,key:'wood',kind:'wood',label:'Fallen timber'},{x:4,y:6,key:'stone',kind:'stone',label:'Loose stones'},{x:2,y:7,key:'oil',kind:'oil',label:'Oil flask'},{x:8,y:7,key:'cache',kind:'cache',label:'Supply chest'},{x:4,y:2,key:'p0',kind:'person',label:'Traveler 1'},{x:3,y:5,key:'p1',kind:'person',label:'Traveler 2'},{x:9,y:2,key:'p2',kind:'person',label:'Traveler 3'},{x:9,y:6,key:'p3',kind:'person',label:'Traveler 4'},{x:6,y:4,key:'bridge',kind:'bridge',label:'Broken crossing'},{x:10,y:4,key:'beacon',kind:'beacon',label:'Great lantern'}];
function keeperCapacity(k=state.keeper){return 80+k.level*30}
function keeperNew(){return {region:0,x:1,y:4,light:80,level:0,wood:0,stone:0,oil:0,steps:0,claimed:[],helped:[],bridges:[],beacons:[],seen:[],used:[],pending:null,message:'Walk to a glowing object, then choose Interact. Your first traveler is northeast of camp.'}}
function keeperClean(v){let k=keeperNew();if(!v||typeof v!=='object')return k;for(const f of ['region','x','y','level','wood','stone','oil','steps','light'])if(Number.isFinite(v[f]))k[f]=Math.max(0,Math.floor(v[f]));k.region=Math.min(3,k.region);k.x=Math.min(11,k.x);k.y=Math.min(8,k.y);k.level=Math.min(3,k.level);k.light=Math.min(keeperCapacity(k),k.light);for(const f of ['claimed','helped','bridges','beacons','seen'])k[f]=Array.isArray(v[f])?[...new Set(v[f].filter(s=>typeof s==='string'&&/^([0-3]):([a-z0-9]+|\d+,\d+)$/.test(s)))].slice(0,500):[];k.used=Array.isArray(v.used)?[...new Set(v.used.filter(n=>Number.isInteger(n)&&QUESTIONS[n]))]:[];let p=v.pending;if(p&&QUESTIONS[p.qid]&&typeof p.target==='string'&&/^[0-3]:(p[0-3]|board)$/.test(p.target))k.pending={qid:p.qid,target:p.target,rewarded:!!p.rewarded,wrong:!!p.wrong,choice:Number.isInteger(p.choice)&&p.choice>=0&&p.choice<4?p.choice:null};k.message='Your expedition is saved. Continue exploring or return to camp.';return k}
state.keeper=keeperNew();try{let old=JSON.parse(localStorage.getItem(KEY)||'null');if(old)state.keeper=keeperClean(old.keeper)}catch{}
let keeperPanel='field';
function keeperKey(key){return state.keeper.region+':'+key}
function keeperReveal(){let k=state.keeper;for(let y=0;y<9;y++)for(let x=0;x<12;x++)if(Math.abs(x-k.x)+Math.abs(y-k.y)<=3){let s=keeperKey(x+','+y);if(!k.seen.includes(s))k.seen.push(s)}}
function keeperWall(x,y){let r=state.keeper.region;return [[0,0],[0,8],[11,0],[11,8],[5,0],[5,1],[5,7],[5,8],...[ [ [2,2],[3,2],[8,5],[7,5] ],[ [2,0],[3,0],[8,3],[8,4] ],[ [2,2],[2,3],[8,0],[9,0] ],[ [3,7],[4,7],[7,1],[8,1] ] ][r]].some(p=>p[0]===x&&p[1]===y)}
function keeperMove(dx,dy){if(page!=='keeper'||keeperPanel!=='field'||state.keeper.pending)return;let k=state.keeper,nx=k.x+dx,ny=k.y+dy;if(nx<0||nx>11||ny<0||ny>8||keeperWall(nx,ny)){k.message='The path is blocked. Find a way around.';keeperPage();return}if(nx===6&&(ny!==4||!k.bridges.includes(keeperKey('bridge')))){k.message=ny===4?'Repair the crossing with 3 timber and 2 stone. Stand beside it and choose Interact.':'The river is too deep here. Cross at the bridge.';keeperPage();return}k.x=nx;k.y=ny;k.steps++;k.light=Math.max(0,k.light-1);k.message='';if(!k.light){k.x=1;k.y=4;k.light=Math.floor(keeperCapacity()/2);k.message='Your lantern dimmed. You returned safely to camp with all your supplies.'}keeperReveal();save();keeperPage()}
function keeperNearby(){let k=state.keeper;return KEEPER_POINTS.filter(p=>Math.abs(p.x-k.x)+Math.abs(p.y-k.y)<=1).sort((a,b)=>(Math.abs(a.x-k.x)+Math.abs(a.y-k.y))-(Math.abs(b.x-k.x)+Math.abs(b.y-k.y)))}
function keeperInteract(key){let k=state.keeper,p=KEEPER_POINTS.find(p=>p.key===key);if(!p||!keeperNearby().some(n=>n.key===key))return;let tag=keeperKey(key);if(p.kind==='camp'){keeperPanel='camp';keeperPage();return}if(['wood','stone','oil','cache'].includes(p.kind)){if(k.claimed.includes(tag)){k.message='You have already gathered these supplies.'}else{k.claimed.push(tag);if(p.kind==='wood')k.wood+=3;if(p.kind==='stone')k.stone+=3;if(p.kind==='oil')k.oil+=2;if(p.kind==='cache'){k.wood+=3;k.stone+=2;k.oil++}k.message='Supplies gathered. They are stored in your backpack.';chime(true)}}else if(p.kind==='bridge'){if(k.bridges.includes(tag))k.message='The crossing is repaired. You can walk across it.';else if(k.wood<3||k.stone<2)k.message='You need 3 timber and 2 stone. Gather supplies or help a traveler.';else{k.wood-=3;k.stone-=2;k.bridges.push(tag);k.message='You rebuilt the crossing. The far side of the river is open.';chime(true)}}else if(p.kind==='person'){if(k.helped.includes(tag))k.message='This traveler has been helped. Their light is part of this place now.';else{keeperChallenge(tag);return}}else if(p.kind==='beacon'){let n=k.helped.filter(t=>t.startsWith(k.region+':')).length;if(k.beacons.includes(tag))k.message='This great lantern is already alight.';else if(n<4)k.message='Help all four travelers before lighting the great lantern. '+n+' / 4 helped.';else if(k.stone<2)k.message='The lantern foundation needs 2 stone. Collect supplies or take a camp challenge.';else{k.stone-=2;k.beacons.push(tag);k.light=keeperCapacity();k.message=k.beacons.length===4?'Morning has reached all four places. You restored the lantern road! Return to camp to revisit any region.':'The great lantern is alight. The next region is now open from camp.';chime(true)}}save();keeperPage()}
function keeperChallenge(target){let k=state.keeper,pool=QUESTIONS.filter(q=>q.c===k.region&&!k.used.includes(q.id));if(!pool.length)pool=QUESTIONS.filter(q=>q.c===k.region);let q=pool[Math.floor(Math.random()*pool.length)];k.pending={qid:q.id,target,rewarded:false,wrong:false,choice:null};save();keeperPage()}
function keeperAnswer(choice){let k=state.keeper,p=k.pending;if(!p||p.rewarded)return;let q=QUESTIONS[p.qid];p.choice=choice;if(!state.results[q.id])state.results[q.id]={choice,correct:choice===q.answer};if(choice!==q.answer){p.wrong=true;save();keeperPage();return}p.rewarded=true;if(!k.used.includes(q.id))k.used.push(q.id);let board=p.target.endsWith(':board');if(!board&&!k.helped.includes(p.target)){k.helped.push(p.target);k.wood+=3;k.stone+=2;k.oil++}if(board){k.wood++;k.stone++}k.light=Math.min(keeperCapacity(),k.light+24);save();chime(true);keeperPage()}
function keeperRest(){let k=state.keeper;k.light=keeperCapacity();k.message='You rested at camp. Your lantern is full.';save();keeperPage()}
function keeperRecall(){let k=state.keeper;k.x=1;k.y=4;keeperPanel='camp';k.message='Back at camp. All your supplies are safe.';keeperReveal();save();keeperPage()}
function keeperUpgrade(){let k=state.keeper;if(k.level>=3){k.message='Your lantern is fully upgraded.'}else if(k.wood<6||k.stone<4){k.message='An upgrade needs 6 timber and 4 stone.'}else{k.wood-=6;k.stone-=4;k.level++;k.light=keeperCapacity();k.message='Lantern upgraded. You can explore longer between rests.';chime(true)}save();keeperPage()}
function keeperTravel(region){let k=state.keeper;if(!Number.isInteger(region)||region<0||region>3||region>0&&!k.beacons.includes((region-1)+':beacon'))return;k.region=region;k.x=1;k.y=4;k.light=keeperCapacity();k.message=KEEPER_REGIONS[region].story;keeperPanel='field';keeperReveal();save();keeperPage()}
function keeperUseOil(){let k=state.keeper;if(!k.oil)k.message='No oil flasks. Gather one in the field or help a traveler.';else if(k.light===keeperCapacity())k.message='Your lantern is already full.';else{k.oil--;k.light=Math.min(keeperCapacity(),k.light+40);k.message='Oil used. Your lantern shines brighter.'}save();keeperPage()}
function keeperQuestion(){let p=state.keeper.pending,q=QUESTIONS[p.qid],done=p.rewarded;return `<section class="qcard"><div class="kicker">${p.target.endsWith(':board')?'Camp reading challenge':'A traveler’s story'} · KJV</div><h2>${esc(q.title)}</h2><p class="scene">${esc(q.scene)}</p><p class="ask">${esc(q.question)}</p>${done?'<div class="verdict">✓ Light gathered · supplies added</div>':`<div class="answers">${shuffle(q.id).map((id,i)=>`<button data-keeperanswer="${id}" class="answer"><span class="letter">${String.fromCharCode(65+i)}</span>${esc(q.options[id])}</button>`).join('')}</div>`}${p.wrong||done?`<p class="small">${done?'A story discovered.':'Read the evidence, then try again. Your supplies are safe.'}</p><div class="ref">${q.ref} · KJV</div><blockquote class="verse">“${esc(q.verse)}”</blockquote>`:''}<button id="keeperQuestionExit" class="${done?'primary ':''}wide">${done?'Return to the adventure →':'Pause encounter · progress saved'}</button></section>`}
function keeperPage(){let k=state.keeper,r=KEEPER_REGIONS[k.region];keeperReveal();main.innerHTML=`<div class="keeperhead"><button id="keeperBack">← Play</button><strong>Lantern Keeper</strong><button id="keeperCamp">Camp</button></div><div class="keeperhud"><span>✦ ${k.light}/${keeperCapacity()}</span><span>Timber ${k.wood}</span><span>Stone ${k.stone}</span><span>Oil ${k.oil}</span></div>${k.pending?keeperQuestion():keeperPanel==='camp'?`<div class="kicker">A safe place to return</div><h2>Your lantern camp</h2><p class="small" style="margin-top:10px">${k.beacons.length} / 4 great lanterns restored · ${k.helped.length} / 16 travelers helped</p>${k.beacons.length===4?'<div class="verdict">✦ The lantern road is restored. Morning has come.</div>':''}<div class="keepercampgrid"><button id="keeperRest"><strong>Rest & refill</strong><span>Free · fill your lantern</span></button><button id="keeperUpgrade"><strong>Upgrade lantern ${k.level}/3</strong><span>6 timber + 4 stone · +30 capacity</span></button><button id="keeperBoard"><strong>Camp challenge</strong><span>Read a passage · earn supplies</span></button><button id="keeperField"><strong>Continue exploring</strong><span>Return to the field</span></button></div><div class="sectionhead"><h3>Choose your road</h3></div><div class="arclist">${KEEPER_REGIONS.map((v,i)=>{let unlocked=i===0||k.beacons.includes((i-1)+':beacon');return `<button data-keepertravel="${i}" ${unlocked?'':'disabled'}><strong>${v.name}</strong><span>${unlocked?k.beacons.includes(i+':beacon')?'Restored · revisit':'Open for exploration':'Light the previous region’s great lantern to unlock'}</span></button>`}).join('')}</div><details><summary>How to explore</summary><p class="small">Move with the arrows, WASD, arrow keys, or swipe the map. Stand on or beside an object and choose Interact. Gather supplies, help four travelers, repair the crossing, and light each great lantern. Movement uses one light. Rest for free or use an oil flask. If your light runs function ensureAudio(){if(!audioContext){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return false;audioContext=new Audio()}audioContext.resume().catch(()=>{});return true}
function startAmbient(){if(!ensureAudio()||ambient)return;let gain=audioContext.createGain();gain.gain.value=.013;gain.connect(audioContext.destination);let nodes=[130.81,196,261.63].map(f=>{let o=audioContext.createOscillator();o.type='sine';o.frequency.value=f;o.connect(gain);o.start();return o});ambient={gain,nodes}}
function stopAmbient(){if(ambient){ambient.nodes.forEach(o=>o.stop());ambient.gain.disconnect();ambient=null}}
function chime(ok){if(!state.sound||!ensureAudio())return;[ok?523.25:392,ok?659.25:440].forEach((f,i)=>{let o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+i*.15;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+.75);o.onended=()=>g.disconnect()})}
